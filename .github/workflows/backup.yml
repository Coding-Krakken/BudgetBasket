name: Database Backup

on:
  schedule:
    # 08:17 UTC daily — off-peak, deliberately not on the hour to avoid
    # contending with other scheduled jobs across GitHub's infrastructure.
    - cron: "17 8 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    name: Backup production database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run backup
        id: backup
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: bash scripts/backup-database.sh backups

      - name: Upload backup artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30

      - name: Open incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Database backup failed — run ${context.runId}`,
              labels: ["ops", "priority:p1"],
              body: `The scheduled database backup failed.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nSee [docs/BACKUP_RESTORE.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/docs/BACKUP_RESTORE.md) for the restore/recovery procedure and how to investigate.`,
            });
